<script>// Embedded in each application. No localStorage business persistence or fallback.
const backend = (() => {
  let revision = null, initial = true, reset = false, busy = false, failed = false;
  let seedData;
  const endpoint = new URL('api/state', location.href.replace(/index\.html(?:\?.*)?$/, ''));
  function failure(message) {
    failed = true;
    document.body.inert = true;
    let box = document.getElementById('backend-failure');
    if (!box) {
      box = document.createElement('dialog'); box.id = 'backend-failure';
      document.documentElement.append(box);
    }
    box.replaceChildren();
    const title = document.createElement('h2'); title.textContent = '数据未保存';
    const detail = document.createElement('p'); detail.textContent = message;
    const button = document.createElement('button'); button.textContent = '刷新并读取服务器数据';
    button.onclick = () => location.reload();
    box.append(title, detail, button); if (!box.open) box.showModal();
  }
  async function request(options) {
    try {
      const response = await fetch(endpoint, {credentials: 'same-origin', cache: 'no-store', ...options});
      if (!response.ok) {
        let message = '服务器不可用或当前账号没有操作权限。';
        try { message = (await response.json()).error || message; } catch (_) {}
        throw Error(message);
      }
      return await response.json();
    } catch (error) {
      failure(error.message || '请求失败，请刷新核对服务器数据。');
      throw error;
    }
  }
  return {
    async load() {
      const result = await request(); revision = result.revision; seedData = result.seed;
      return JSON.stringify(result.data);
    },
    seed() {
      if (!initial) reset = true;
      return structuredClone(seedData);
    },
    ready() { initial = false; window.backendReady = true; document.documentElement.dataset.backendReady = 'true'; },
    async save(data) {
      if (failed || busy || revision === null) throw Error('请等待保存完成或刷新后重试');
      busy = true; document.body.inert = true;
      try {
        const csrf = document.cookie.split('; ').find(x => x.startsWith('csrftoken='))?.slice(10) || '';
        const result = await request({method: 'POST', headers: {
          'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrf
        }, body: JSON.stringify({revision, action: reset ? 'reset' : 'save', data,
          context: {product: document.getElementById('shipProduct')?.value, room: document.getElementById('shipRoom')?.value}})});
        revision = result.revision; reset = false;
      } finally {
        busy = false;
        if (!failed) document.body.inert = false;
      }
    },
    failure
  };
})();
window.addEventListener('unhandledrejection', event => { backend.failure(event.reason?.message || '操作失败，请刷新核对'); event.preventDefault(); });

(async () => {
const backendInitial = await backend.load();

'use strict';const KEY='development-12-inventory-v1';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>date(new Date()),offset=n=>{let d=new Date();d.setDate(d.getDate()+n);return date(d)},days=b=>Math.round((Date.parse(b.expiry+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000),status=b=>days(b)<0?'red':days(b)<=30?'yellow':'green';
function seed(){let batches=[{id:'B-1001',barcode:'990000001',name:'某企业试剂 A',place:'LAB-01',unit:'瓶',expiry:offset(18),min:10,qty:8},{id:'B-1002',barcode:'990000002',name:'某企业耗材 B',place:'LAB-02',unit:'盒',expiry:offset(180),min:20,qty:64},{id:'B-1003',barcode:'990000003',name:'某企业试剂 C',place:'LAB-01',unit:'瓶',expiry:offset(-5),min:5,qty:12},{id:'B-1004',barcode:'990000004',name:'某企业耗材 D',place:'LAB-03',unit:'包',expiry:offset(365),min:10,qty:6}];return {version:1,batches,logs:batches.map((b,i)=>({id:'TX-DEMO-'+(i+1),time:new Date().toISOString(),batch:b.id,name:b.name,unit:b.unit,type:'in',qty:b.qty,before:0,after:b.qty,note:'演示初始入库',actor:'douyin'}))}}
let state,tab='inventory',editing=null,moving=null,timer;function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}try{const raw=backendInitial;state=raw?JSON.parse(raw):backend.seed();if(state.version!==1||!Array.isArray(state.batches)||!Array.isArray(state.logs)||state.batches.some(b=>!Number.isSafeInteger(b.qty)||b.qty<0||!Number.isFinite(days(b))))throw Error();if(!raw)(await backend.save(state))}catch(e){state=backend.seed();toast('本地数据无法读取，暂用演示数据；请检查浏览器存储或重置。')}
async function commit(next){try{(await backend.save(next));state=next;render();return true}catch(e){toast('保存失败：服务器不可用或数据校验失败，操作未生效');return false}}

function render(){const bs=state.batches;$('#stats').innerHTML=[['登记批次',bs.length],['临期批次',bs.filter(b=>status(b)==='yellow').length],['已过期批次',bs.filter(b=>status(b)==='red').length],['低库存批次',bs.filter(b=>b.qty<=b.min).length]].map(([t,n])=>`<div class="stat"><span>${t}</span><strong>${n}<small style="font-size:12px;font-weight:400"> 批</small></strong></div>`).join('');$('#alerts').innerHTML=bs.filter(b=>status(b)!=='green'||b.qty<=b.min).map(b=>`<p><b>${esc(b.id)}</b> ${status(b)!=='green'?badge(b):''} ${b.qty<=b.min?`<span class="pill red">库存 ${b.qty} / 阈值 ${b.min}</span>`:''}</p>`).join('')||'<p>暂无效期与库存提醒</p>';$('#inventoryTab').classList.toggle('active',tab==='inventory');$('#logsTab').classList.toggle('active',tab==='logs');const rows=tab==='inventory'?visible():logsVisible();$('#table').innerHTML=tab==='inventory'?`<table><thead><tr><th>耗材 / 批次</th><th>条码 / 位置</th><th>库存 / 阈值</th><th>有效期</th><th>效期状态</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${esc(b.name)}</b><small>${esc(b.id)}</small></td><td>${esc(b.barcode)}<small>${esc(b.place)}</small></td><td><b>${b.qty}</b> ${esc(b.unit)}<small>阈值 ${b.min} ${b.qty<=b.min?'· 低库存':''}</small></td><td>${esc(b.expiry)}</td><td>${badge(b)}</td><td><div class="actions"><button data-act="in" data-id="${esc(b.id)}">入库</button><button data-act="out" data-id="${esc(b.id)}">出库</button><button data-act="edit" data-id="${esc(b.id)}">修改</button></div></td></tr>`).join('')}</tbody></table>`:`<table><thead><tr><th>流水 / 时间</th><th>耗材 / 批次</th><th>操作</th><th>数量变化</th><th>库存变化</th><th>备注 / 操作身份</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.id)}<small>${esc(new Date(l.time).toLocaleString('zh-CN'))}</small></td><td>${esc(l.name)}<small>${esc(l.batch)}</small></td><td><span class="pill ${l.type==='in'?'green':'yellow'}">${l.type==='in'?'入库':'出库'}</span></td><td>${l.type==='in'?'+':'−'}${l.qty} ${esc(l.unit)}</td><td>${l.before} → ${l.after}</td><td>${esc(l.note)}<small>${esc(l.actor)}</small></td></tr>`).join('')}</tbody></table>`;if(!rows.length)$('#table').innerHTML+='<div class="empty">暂无匹配记录，请调整筛选或登记新批次。</div>'}
function openBatch(id){editing=id||null;const f=$('#batchForm');f.reset();$('#batchError').textContent='';$('#batchTitle').textContent=id?'修改批次资料':'登记耗材批次';f.elements.id.readOnly=!!id;$('#initialLabel').hidden=!!id;f.elements.initial.disabled=!!id;if(id){const b=state.batches.find(x=>x.id===id);for(const k of ['id','name','barcode','place','unit','expiry','min'])f.elements[k].value=b[k]}else{f.elements.expiry.value=offset(180);f.elements.min.value=10}$('#batchDialog').showModal()}
function log(b,type,qty,before,note){return {id:'TX-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),time:new Date().toISOString(),batch:b.id,name:b.name,unit:b.unit,type,qty,before,after:b.qty,note,actor:'douyin'}}
$('#batchForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b={};for(const k of ['name','id','barcode','place','unit','expiry'])b[k]=f.elements[k].value.trim();b.min=Number(f.elements.min.value);const initial=editing?0:Number(f.elements.initial.value);let error='';if(Object.values(b).some(v=>v===''))error='请填写所有字段，不能仅为空格';else if(!Number.isSafeInteger(b.min)||b.min<0||b.min>1e8||!Number.isSafeInteger(initial)||initial<0||initial>1e8)error='数量和阈值必须为 0 至 100000000 的整数';else if(!/^\d{4}-\d{2}-\d{2}$/.test(b.expiry)||b.expiry<'2000-01-01'||b.expiry>'2100-12-31')error='请输入有效日期';else if(state.batches.some(x=>x.id!==editing&&[x.id,x.barcode].some(v=>v===b.id||v===b.barcode)))error='批次编号或条码重复，请使用唯一编号';if(error){$('#batchError').textContent=error;return}const next=structuredClone(state);if(editing){const old=next.batches.find(x=>x.id===editing);Object.assign(old,b)}else{b.qty=initial;next.batches.push(b);if(initial)next.logs.push(log(b,'in',initial,0,'批次登记初始入库'))}if((await commit(next))){$('#batchDialog').close();toast('批次资料已保存')}};

$('#moveForm').onsubmit=async e=>{e.preventDefault();const f=e.target,type=f.elements.type.value,qty=Number(f.elements.qty.value),b=state.batches.find(x=>x.id===moving);let error='';if(!Number.isSafeInteger(qty)||qty<=0||qty>1e8)error='数量必须为 1 至 100000000 的正整数';else if(type==='out'&&status(b)==='red')error='该批次已过期，禁止出库';else if(type==='out'&&qty>b.qty)error='出库数量不能超过当前库存';else if(type==='in'&&b.qty+qty>1e8)error='库存不能超过 100000000';if(error){$('#moveError').textContent=error;return}const next=structuredClone(state),item=next.batches.find(x=>x.id===moving),before=item.qty;item.qty+=type==='in'?qty:-qty;next.logs.push(log(item,type,qty,before,f.elements.note.value.trim()||'常规登记'));if((await commit(next))){$('#moveDialog').close();toast(`${type==='in'?'入库':'出库'}成功，库存 ${before} → ${item.qty}`)}};

function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}$('#export').onclick=()=>{const rows=tab==='inventory'?[['耗材名称','批次编号','条码','位置','单位','库存','阈值','有效期','效期状态'],...visible().map(b=>[b.name,b.id,b.barcode,b.place,b.unit,b.qty,b.min,b.expiry,status(b)==='red'?'已过期':status(b)==='yellow'?'临期':'正常'])]:[['流水编号','时间','批次编号','耗材名称','类型','数量','单位','操作前','操作后','备注','身份'],...logsVisible().map(l=>[l.id,l.time,l.batch,l.name,l.type==='in'?'入库':'出库',l.qty,l.unit,l.before,l.after,l.note,l.actor])];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`development-12-${tab}-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选结果')};window.addEventListener('storage',e=>{if(e.key===KEY)location.reload()});setInterval(render,60000);render();
